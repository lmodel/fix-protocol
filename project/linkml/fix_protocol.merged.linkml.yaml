      "title": "Presence",
      "comments": [
        "FIX Latest states only required. A member with no presence is optional, which is Orchestra 1.0's default."
      ],
      "from_schema": "https://w3id.org/lmodel/fix-protocol",
      "permissible_values": {
        "optional": {
          "text": "optional",
          "description": "The member may be left out.",
